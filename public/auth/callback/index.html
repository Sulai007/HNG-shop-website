<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authenticating with Nova Stores...</title>
  </head>
  <body style="font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #F8FAFC; color: #0F172A;">
    <div style="text-align: center; padding: 24px; max-width: 400px;">
      <div style="width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 50%; background: #EA580C; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 20px;">
        N
      </div>
      <h2 style="font-weight: 700; margin: 0 0 8px; color: #0F172A;">Authentication Successful</h2>
      <p style="color: #64748B; font-size: 14px; margin: 0;">Syncing your account with Nova Stores...</p>
    </div>
    <script>
      try {
        if (window.opener) {
          window.opener.postMessage({ 
            type: 'OAUTH_AUTH_SUCCESS', 
            hash: window.location.hash, 
            search: window.location.search 
          }, '*');
          setTimeout(() => window.close(), 600);
        } else {
          window.location.href = '/' + window.location.hash + window.location.search;
        }
      } catch (e) {
        window.location.href = '/' + window.location.hash + window.location.search;
      }
    </script>
  </body>
</html>
